services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adt_viewer
      POSTGRES_PASSWORD: adt_viewer
      POSTGRES_DB: adt_viewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adt_viewer"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://adt_viewer:adt_viewer@db:5432/adt_viewer
    volumes:
      - ./backend:/app
      - ./sample_data:/sample_data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
